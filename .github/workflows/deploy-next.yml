name: Build and deploy unified Next.js

on:
  push:
    branches: ["main"]
    paths: ["web/**", "deploy/**", ".dockerignore", ".github/workflows/deploy-next.yml"]
  workflow_dispatch:
    inputs:
      activate:
        description: "Activate on the existing VPS after candidate checks (main only)"
        type: boolean
        default: false

concurrency:
  group: deploy-reachard
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    secrets: inherit
  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the reviewed Linux runtime
        env:
          HEROUI_KEY: ${{ secrets.HEROUI_KEY }}
        run: |
          test -n "$HEROUI_KEY"
          docker build --secret id=heroui_key,env=HEROUI_KEY --build-arg RELEASE_SHA="$GITHUB_SHA" -f web/Dockerfile -t "reachard:$GITHUB_SHA" .
      - name: Verify the final container without production credentials
        run: |
          set -euo pipefail
          docker run --rm --entrypoint node "reachard:$GITHUB_SHA" -e "import('postgres').then(()=>console.log('Migration client ready'))"
          trap 'docker rm -f reachard_image_smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name reachard_image_smoke --network host --memory 512m --memory-swap 768m \
            -e PORT=18787 -e AUTH_SECRET=isolated-image-check-secret-at-least-32-characters \
            -e BASE_URL=https://reachard.co -e POSTGRES_URL=postgresql://mock:mock@127.0.0.1:1/mock \
            -e STRIPE_SECRET_KEY=sk_test_disabled -e STRIPE_WEBHOOK_SECRET=whsec_disabled \
            -e CONTACT_PROVIDER=mock "reachard:$GITHUB_SHA"
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18787/live >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18787/live
          curl --fail --silent -H 'Host: reachard.co' http://127.0.0.1:18787/ >/dev/null
          curl --fail --silent -H 'Host: reachard.co' http://127.0.0.1:18787/sign-in >/dev/null
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:18787/api/extension/account)" = 401
      - name: Configure existing deployment identity
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-server
            HostName $SSH_HOST
            Port ${SSH_PORT:-22}
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF
      - name: Transfer the private runtime over SSH
        run: |
          docker save "reachard:$GITHUB_SHA" | gzip | ssh deploy-server 'gunzip | sudo docker load'
          ssh deploy-server 'sudo mkdir -p /opt/reachard/deploy'
          rsync -az --rsync-path='sudo rsync' deploy/ deploy-server:/opt/reachard/deploy/
      - name: Stage or activate the verified candidate
        env:
          ACTIVATE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.activate == true) }}
        run: |
          if [ "$ACTIVATE" = true ]; then
            ssh deploy-server "sudo bash /opt/reachard/deploy/activate.sh 'reachard:$GITHUB_SHA' activate"
          elif ssh deploy-server 'sudo test -f /opt/reachard/runtime.env'; then
            ssh deploy-server "sudo bash /opt/reachard/deploy/activate.sh 'reachard:$GITHUB_SHA' stage"
          else
            echo 'Image transferred. Production remains unchanged; runtime configuration is required before candidate startup.'
          fi
