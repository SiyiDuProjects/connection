name: Build and deploy unified Next.js

on:
  push:
    branches: ["main", "codex/nextjs-vps"]
    paths: ["web/**", "deploy/**", ".dockerignore", ".github/workflows/deploy-next.yml"]
  workflow_dispatch:
    inputs:
      activate:
        description: "Activate on the existing VPS after candidate checks (main only)"
        type: boolean
        default: false

concurrency:
  group: deploy-contacts-server
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    secrets: inherit
  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the reviewed Linux runtime
        env:
          HEROUI_KEY: ${{ secrets.HEROUI_KEY }}
        run: |
          test -n "$HEROUI_KEY"
          docker build --secret id=heroui_key,env=HEROUI_KEY --build-arg RELEASE_SHA="$GITHUB_SHA" -f web/Dockerfile -t "reachard:$GITHUB_SHA" .
      - name: Configure existing deployment identity
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-server
            HostName $SSH_HOST
            Port ${SSH_PORT:-22}
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF
      - name: Transfer the private runtime over SSH
        run: |
          docker save "reachard:$GITHUB_SHA" | gzip | ssh deploy-server 'gunzip | sudo docker load'
          ssh deploy-server 'sudo mkdir -p /opt/reachard/deploy'
          rsync -az --rsync-path='sudo rsync' deploy/ deploy-server:/opt/reachard/deploy/
      - name: Stage or activate the verified candidate
        env:
          ACTIVATE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.activate == true) }}
        run: |
          if [ "$ACTIVATE" = true ]; then
            ssh deploy-server "sudo bash /opt/reachard/deploy/activate.sh 'reachard:$GITHUB_SHA' activate"
          elif ssh deploy-server 'sudo test -f /opt/reachard/runtime.env'; then
            ssh deploy-server "sudo bash /opt/reachard/deploy/activate.sh 'reachard:$GITHUB_SHA' stage"
          else
            echo 'Image transferred. Production remains unchanged; runtime configuration is required before candidate startup.'
          fi
