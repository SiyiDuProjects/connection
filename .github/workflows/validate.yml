name: Validate Reachard

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Check server and provider fixtures
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          npm run test:hunter
          npm run test:rapidapi
          npm run test:treg
          npm run test:usage-guard
          npm run test:spend-budget
          npm run test:email
          npm run test:intelligence
          npm run test:intelligence:large

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check extension JavaScript
        run: |
          node --check extension/content.js
          node --check extension/service_worker.js
          node --check extension/web_bridge.js
          node scripts/check-extension.mjs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      AUTH_SECRET: validation-only-secret-with-at-least-32-characters
      BASE_URL: http://localhost:3000
      POSTGRES_URL: postgresql://user:password@localhost:5432/reachard
      STRIPE_SECRET_KEY: sk_test_validation
      STRIPE_WEBHOOK_SECRET: whsec_validation
      HEROUI_KEY: ${{ secrets.HEROUI_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Pro components through CollectUI
        run: npx -y hpsetup@4.7.1 react --auto
      - run: node scripts/check-pro-install.mjs
      - run: node scripts/check-ui-boundaries.mjs
      - run: pnpm test:billing
      - run: pnpm test:email
      - run: node --test --test-concurrency=1 scripts/auth-session.test.mjs scripts/password-reset.test.mjs scripts/account-security.test.cjs
      - run: node --test --test-concurrency=1 scripts/free-trial.test.mjs scripts/auth-rate-limit.test.mjs scripts/launch-audit.test.cjs
      - run: node --test scripts/dashboard.test.mjs
      - run: pnpm build
