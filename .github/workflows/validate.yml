name: Validate Reachard

on:
  workflow_call:
    secrets:
      HEROUI_KEY:
        required: true
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify deployment rollback
        run: python3 -m unittest discover -s deploy -p "test_*.py"
      - name: Check extension JavaScript
        run: |
          node scripts/sync-brand.mjs --check
          node --test scripts/brand.test.mjs
          node --test scripts/local-env.test.mjs
          node --check extension/content.js
          node --check extension/service_worker.js
          node --check extension/web_bridge.js
          node scripts/check-extension.mjs
          node --test scripts/extension-*.test.mjs
          node scripts/prepare-chrome-store.mjs artifacts/chrome-store-ci

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      AUTH_SECRET: validation-only-secret-with-at-least-32-characters
      BASE_URL: http://localhost:3000
      POSTGRES_URL: postgresql://user:password@localhost:5432/reachard
      STRIPE_SECRET_KEY: sk_test_validation
      STRIPE_WEBHOOK_SECRET: whsec_validation
      HEROUI_KEY: ${{ secrets.HEROUI_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/pro-install.test.mjs
      - name: Install Pro components through CollectUI
        run: node scripts/install-reviewed-pro.mjs
      - run: node scripts/check-pro-install.mjs
      - run: node scripts/check-ui-boundaries.mjs
      - run: pnpm test:contacts
      - run: node --test --test-concurrency=1 scripts/*.test.mjs scripts/*.test.cjs
      - run: pnpm build
      - run: node scripts/verify-unified-runtime.mjs
