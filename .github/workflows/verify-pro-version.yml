name: Verify reviewed Pro distribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the existing CollectUI distribution helper
        run: npm install --prefix "$RUNNER_TEMP/pro-distribution" --ignore-scripts --no-audit --no-fund hpsetup@4.7.1
      - name: Verify exact beta.9 availability without deploying
        env:
          HEROUI_KEY: ${{ secrets.HEROUI_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, statSync } from 'node:fs';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const base = join(process.env.RUNNER_TEMP, 'pro-distribution/node_modules/hpsetup');
          const { PRODUCTS } = await import(pathToFileURL(join(base, 'src/constants.js')));
          const { downloadFromProxy } = await import(pathToFileURL(join(base, 'src/download.js')));
          const key = process.env.HEROUI_KEY?.trim();
          if (!key || !/^hp_[0-9a-f]+$/.test(key)) {
            console.error('Configured HEROUI_KEY is missing or malformed.');
            process.exit(1);
          }
          const version = '1.0.0-beta.9';
          const target = join(process.env.RUNNER_TEMP, 'reviewed-pro-package');
          let httpStatus = null;
          const originalFetch = globalThis.fetch;
          globalThis.fetch = async (...args) => {
            const response = await originalFetch(...args);
            httpStatus = response.status;
            return response;
          };
          try {
            await downloadFromProxy(PRODUCTS.react, version, target, key, false, true);
            const installed = JSON.parse(readFileSync(join(target, 'package.json'), 'utf8'));
            if (installed.version !== version) throw new Error('Unexpected package version');
            for (const entry of ['dist/index.js', 'dist/css/index.css']) {
              if (!statSync(join(target, entry)).isFile()) throw new Error('Missing runtime entry');
            }
            console.log(JSON.stringify({ expected: version, received: installed.version, httpStatus, runtimeEntries: 'present', deployed: false }));
          } catch {
            // Provider error bodies can contain account details; emit no raw errors or URLs.
            console.error(JSON.stringify({ expected: version, httpStatus, verified: false, deployed: false }));
            process.exitCode = 1;
          }
          NODE
