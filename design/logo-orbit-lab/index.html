<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reachard Logo Lab</title><style>body{margin:0;background:white}</style></head><body><div id="reachard-logo-lab">
  <header><div><span class="eyebrow">REACHARD / LOGO STUDIES</span><h1>找到刚刚好的连接。</h1></div><span class="count">324 个矢量变体</span></header>
  <div class="controls">
    <label>方向 <select id="family"><option value="recommended">精选 12 个</option><option value="all">全部 324 个</option><option value="A">A · 均衡</option><option value="B">B · 开放</option><option value="C">C · 紧凑</option><option value="D">D · 实心连接点</option><option value="E">E · 中心聚焦</option><option value="F">F · 椭圆舒展</option></select></label>
    <label>配色 <select id="scheme"><option value="light">深灰 / 白底</option><option value="blue">白色 / 蓝底</option><option value="dark">白色 / 深灰底</option></select></label>
    <label>尺寸 <input id="size" type="range" min="32" max="112" value="72" step="8"><output id="size-value">72px</output></label>
    <label class="search">编号 <input id="lookup" placeholder="例如 A027" maxlength="4" aria-label="按编号查找"></label>
  </div>
  <section id="compare" hidden aria-label="已选对比"><div class="section-label"><span>对比 <span id="compare-count"></span></span><button id="clear" type="button">清空</button></div><div id="comparison"></div></section>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="grid" aria-label="Logo 变体"></div>
  <dialog id="detail"><div class="dialog-head"><h2 id="detail-title"></h2><button id="close" type="button" aria-label="关闭预览">关闭</button></div><div id="detail-mark" class="surface"></div><div id="detail-sizes"></div><p id="detail-params"></p><div class="detail-actions"><button id="select-detail" type="button">加入对比</button><button id="download" type="button">下载 SVG</button></div></dialog>
</div>
<style>
#reachard-logo-lab{--ink:#252729;--paper:#fff;--accent:#007aff;--line:#e8e9eb;font:15px/1.5 Arial,'Microsoft YaHei',sans-serif;color:var(--ink);background:var(--paper);max-width:1440px;margin:auto;padding:36px;box-sizing:border-box}
#reachard-logo-lab *{box-sizing:border-box}#reachard-logo-lab header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}#reachard-logo-lab .eyebrow{font-size:11px;letter-spacing:.18em;color:#73777c}#reachard-logo-lab h1{font-size:29px;font-weight:500;letter-spacing:-1px;margin:8px 0}#reachard-logo-lab .count{color:#73777c;white-space:nowrap}
#reachard-logo-lab button,#reachard-logo-lab input,#reachard-logo-lab select{font:inherit}#reachard-logo-lab button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);padding:7px 12px;border-radius:8px}#reachard-logo-lab button:focus-visible,#reachard-logo-lab input:focus-visible,#reachard-logo-lab select:focus-visible{outline:3px solid #007aff;outline-offset:3px}#reachard-logo-lab .controls{display:flex;gap:18px;align-items:center;flex-wrap:wrap;border-block:1px solid var(--line);padding:16px 0}#reachard-logo-lab label{display:flex;align-items:center;gap:8px;font-size:13px;color:#62676d}#reachard-logo-lab select,#reachard-logo-lab input:not([type=range]){border:1px solid #d7d9dd;border-radius:7px;padding:7px;background:white;color:var(--ink);max-width:175px}#reachard-logo-lab input[type=range]{width:100px;accent-color:var(--accent)}#reachard-logo-lab .search input{width:98px}#reachard-logo-lab output{min-width:38px}
#reachard-logo-lab #status{font-size:13px;color:#62676d;min-height:20px;margin:18px 0}#reachard-logo-lab #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:16px}#reachard-logo-lab .tile{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}#reachard-logo-lab .tile.selected{border-color:var(--accent)}#reachard-logo-lab .surface{background:var(--surface,#fff);color:var(--mark,#252729);display:flex;align-items:center;justify-content:center;border-radius:9px}#reachard-logo-lab .tile .preview{width:100%;height:144px;border:0;padding:12px}#reachard-logo-lab .tile .preview svg{width:var(--size,72px);height:var(--size,72px)}#reachard-logo-lab .meta{display:flex;justify-content:space-between;align-items:center;margin:10px 0 0}#reachard-logo-lab .meta strong{font-weight:500;font-size:14px}#reachard-logo-lab .meta button{font-size:12px;padding:4px 8px}#reachard-logo-lab .meta button[aria-pressed=true]{color:var(--accent);background:#edf5ff;border-color:#c8e1ff}#reachard-logo-lab .tile small{display:block;color:#7a7f86;font-size:11px;margin-top:6px}
#reachard-logo-lab #compare{border-bottom:1px solid var(--line);padding:20px 0}#reachard-logo-lab .section-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}#reachard-logo-lab #comparison{display:flex;gap:14px;overflow:auto;padding:4px}#reachard-logo-lab .comp{flex:1;min-width:130px;text-align:center}#reachard-logo-lab .comp .surface{height:135px}#reachard-logo-lab .comp svg{width:90px;height:90px}#reachard-logo-lab .comp button{font-size:12px;margin-top:6px}
#reachard-logo-lab dialog{border:1px solid var(--line);border-radius:16px;width:min(520px,calc(100vw - 32px));padding:24px;background:white;color:var(--ink)}#reachard-logo-lab dialog::backdrop{background:#0007}#reachard-logo-lab .dialog-head{display:flex;align-items:center;justify-content:space-between}#reachard-logo-lab h2{font-size:22px;font-weight:500;margin:0}#reachard-logo-lab #detail-mark{height:260px;margin-top:20px}#reachard-logo-lab #detail-mark svg{width:190px;height:190px}#reachard-logo-lab #detail-sizes{display:flex;justify-content:space-around;align-items:flex-end;margin-top:20px}#reachard-logo-lab .sample{text-align:center}#reachard-logo-lab .sample .surface{padding:10px;margin-bottom:6px}#reachard-logo-lab .sample small{font-size:12px;color:#62676d}#reachard-logo-lab #detail-params{font-size:12px;color:#73777c}#reachard-logo-lab .detail-actions{display:flex;gap:8px;justify-content:flex-end}#reachard-logo-lab #download{background:var(--accent);color:white;border-color:var(--accent)}
@media(max-width:600px){#reachard-logo-lab{padding:18px}#reachard-logo-lab header{align-items:flex-start;flex-direction:column;gap:4px}#reachard-logo-lab h1{font-size:24px}#reachard-logo-lab .controls{gap:12px}#reachard-logo-lab #grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}#reachard-logo-lab .tile{padding:8px}#reachard-logo-lab .tile .preview{height:126px}}
</style>
<script>// Reachard mark studies derived from Lucide Orbit; see LICENSE.lucide.txt.
(function (root) {
  const families = [
    { key: 'A', name: '均衡', rx: 9.5, ry: 9.5, gap: 38 },
    { key: 'B', name: '开放', rx: 9.5, ry: 9.5, gap: 56 },
    { key: 'C', name: '紧凑', rx: 8.7, ry: 8.7, gap: 34 },
    { key: 'D', name: '实心连接点', rx: 9.5, ry: 9.5, gap: 42, solidNodes: true },
    { key: 'E', name: '中心聚焦', rx: 9.5, ry: 9.5, gap: 44, solidCenter: true },
    { key: 'F', name: '椭圆舒展', rx: 10, ry: 8.5, gap: 42 },
  ];
  const round = n => +n.toFixed(5);
  function mark(p, color = '#252729') {
    const point = degrees => { const a = degrees * Math.PI / 180; return [round(12 + p.rx * Math.cos(a)), round(12 + p.ry * Math.sin(a))]; };
    // Join the arc under each endpoint circle, so no background-colored masks are needed.
    const arc = a => `<path d="M${point(a).join(' ')} A${p.rx} ${p.ry} 0 0 1 ${point(a + 180 - p.gap).join(' ')}"/>`;
    const node = a => { const [x, y] = point(a); return `<circle cx="${x}" cy="${y}" r="${p.node}" fill="${p.solidNodes ? color : 'none'}"/>`; };
    // Start arcs at the node's boundary to preserve hollow centers with no masking.
    const cut = a => {
      let lo = a, hi = a + 40;
      const [x, y] = point(a);
      for (let i = 0; i < 30; i++) { const mid = (lo + hi) / 2; const [mx, my] = point(mid); if (Math.hypot(mx - x, my - y) < p.node) lo = mid; else hi = mid; }
      return `<path d="M${point((lo + hi) / 2).join(' ')} A${p.rx} ${p.ry} 0 0 1 ${point(a + 180 - p.gap).join(' ')}"/>`;
    };
    const centerRadius = p.solidCenter ? round(p.center * .64) : p.center;
    return `<g fill="none" stroke="${color}" stroke-width="${p.stroke}" stroke-linecap="round" stroke-linejoin="round">${cut(p.angle)}${cut(p.angle + 180)}<circle cx="12" cy="12" r="${centerRadius}" fill="${p.solidCenter ? color : 'none'}"/>${node(p.angle)}${node(p.angle + 180)}</g>`;
  }
  function variants() {
    const results = [];
    for (const f of families) {
      let count = 0;
      for (const stroke of [1.35, 1.6, 1.85]) for (const center of [2.7, 3.25, 3.8]) for (const node of [1.55, 1.85, 2.15]) for (const angle of [-45, -30]) {
        results.push({ ...f, stroke, center, node, angle, id: `${f.key}${String(++count).padStart(3, '0')}` });
      }
    }
    return results;
  }
  const api = { families, variants, mark };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.ReachardGeometry = api;
})(typeof window === 'undefined' ? globalThis : window);

window.REACHARD_LICENSE="ISC License\n\nCopyright (c) for portions of Lucide are held by Cole Bemis 2013-2022 as part of Feather (MIT). All other copyright (c) for Lucide are held by Lucide Contributors 2022.\n\nPermission to use, copy, modify, and/or distribute this software for any\npurpose with or without fee is hereby granted, provided that the above\ncopyright notice and this permission notice appear in all copies.\n\nTHE SOFTWARE IS PROVIDED \"AS IS\" AND THE AUTHOR DISCLAIMS ALL WARRANTIES\nWITH REGARD TO THIS SOFTWARE INCLUDING ALL IMPLIED WARRANTIES OF\nMERCHANTABILITY AND FITNESS. IN NO EVENT SHALL THE AUTHOR BE LIABLE FOR\nANY SPECIAL, DIRECT, INDIRECT, OR CONSEQUENTIAL DAMAGES OR ANY DAMAGES\nWHATSOEVER RESULTING FROM LOSS OF USE, DATA OR PROFITS, WHETHER IN AN\nACTION OF CONTRACT, NEGLIGENCE OR OTHER TORTIOUS ACTION, ARISING OUT OF\nOR IN CONNECTION WITH THE USE OR PERFORMANCE OF THIS SOFTWARE.\n";</script>
<script>
(()=>{
 const root=document.getElementById('reachard-logo-lab'), q=s=>root.querySelector(s);
 const G=window.ReachardGeometry, list=G.variants(), byId=new Map(list.map(v=>[v.id,v]));
 const recommended=['A009','A027','A045','B025','B027','C027','C045','D025','D027','E027','F027','F045'];
 let selected=[], active=null;
 const svg=(v,size=72)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 26 26" width="${size}" height="${size}" role="img" aria-label="${v.id} ${v.name}">${G.mark(v,'currentColor')}</svg>`;
 function setStatus(text){q('#status').textContent=text;}
 function render(){
  const mode=q('#family').value, lookup=q('#lookup').value.trim().toUpperCase();
  const items=lookup?list.filter(v=>v.id.includes(lookup)):mode==='recommended'?recommended.map(id=>byId.get(id)):list.filter(v=>mode==='all'||v.key===mode);
  q('#grid').innerHTML=items.map(v=>`<article class="tile ${selected.includes(v.id)?'selected':''}"><button class="preview surface" data-open="${v.id}" aria-label="放大 ${v.id}">${svg(v)}</button><div class="meta"><strong>${v.id} · ${v.name}</strong><button data-select="${v.id}" aria-label="对比 ${v.id}" aria-pressed="${selected.includes(v.id)}">${selected.includes(v.id)?'已选':'对比'}</button></div><small>线宽 ${v.stroke} · 中心 ${v.center}</small></article>`).join('');
  setStatus(`${items.length} 个版本 · 点击图形放大，最多选 6 个对比`);
  renderCompare();
 }
 function renderCompare(){q('#compare').hidden=!selected.length;q('#compare-count').textContent=selected.join(' / ');q('#comparison').innerHTML=selected.map(id=>`<div class="comp"><button class="surface" data-open="${id}" aria-label="放大 ${id}">${svg(byId.get(id),90)}</button><button data-select="${id}" aria-label="移除 ${id}">${id} ×</button></div>`).join('');}
 function toggle(id){if(selected.includes(id))selected=selected.filter(x=>x!==id);else if(selected.length<6)selected.push(id);else {setStatus('最多同时对比 6 个，请先移除一个。');return;}render();if(active)q('#select-detail').textContent=selected.includes(active.id)?'移出对比':'加入对比';}
 function open(id){active=byId.get(id);q('#detail-title').textContent=`${id} · ${active.name}`;q('#detail-mark').innerHTML=svg(active,190);q('#detail-sizes').innerHTML=[16,24,32,48].map(s=>`<div class="sample"><div class="surface">${svg(active,s)}</div><small>${s}px</small></div>`).join('');q('#detail-params').textContent=`线宽 ${active.stroke} / 中心 ${active.center} / 连接点 ${active.node} / 开口 ${active.gap}° / 倾角 ${active.angle}°`;q('#select-detail').textContent=selected.includes(id)?'移出对比':'加入对比';q('#detail').showModal();}
 root.addEventListener('click',e=>{const o=e.target.closest('[data-open]'),s=e.target.closest('[data-select]');if(o)open(o.dataset.open);if(s)toggle(s.dataset.select);});
 q('#family').addEventListener('change',()=>{q('#lookup').value='';render();});q('#lookup').addEventListener('input',render);
 q('#scheme').addEventListener('change',()=>{const scheme=q('#scheme').value;root.style.setProperty('--surface',scheme==='light'?'#fff':scheme==='blue'?'#007aff':'#252729');root.style.setProperty('--mark',scheme==='light'?'#252729':'#fff');});
 q('#size').addEventListener('input',()=>{root.style.setProperty('--size',q('#size').value+'px');q('#size-value').textContent=q('#size').value+'px';});
 q('#clear').addEventListener('click',()=>{selected=[];render();});q('#close').addEventListener('click',()=>q('#detail').close());q('#select-detail').addEventListener('click',()=>toggle(active.id));
 q('#download').addEventListener('click',()=>{const scheme=q('#scheme').value;const background=scheme==='light'?'':`<rect x="-1" y="-1" width="26" height="26" rx="5" fill="${scheme==='blue'?'#007aff':'#252729'}"/>`;const source=`<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="-1 -1 26 26"><!-- ${window.REACHARD_LICENSE} -->${background}${G.mark(active,scheme==='light'?'#252729':'#fff')}</svg>`;const url=URL.createObjectURL(new Blob([source],{type:'image/svg+xml'}));const a=document.createElement('a');a.href=url;a.download=`reachard-${active.id}-${scheme}.svg`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
 render();
})();
</script>
</body></html>
